name: Publicar Hugo en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Hugo
        env:
          HUGO_VERSION: 0.131.0
        run: |
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Construir la web
        run: |
          make check
          make build

      - name: Subir archivos generados
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Publicar en GitHub Pages
        uses: actions/deploy-pages@v4
